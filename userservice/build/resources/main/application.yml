spring:
  application:
    name: user-service

  jpa:
    hibernate:
      ddl-auto: validate
  datasource:
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  liquibase:
    change-log: classpath:db/changelog/db.create-tables.yaml
    enabled: true

  cache:
    type: redis

  data:
    redis:
      port: 6379
server:
  port: 8001