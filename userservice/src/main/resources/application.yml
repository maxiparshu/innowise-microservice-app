spring:
  application:
    name: user-service
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate

  liquibase:
    change-log: classpath:db/changelog/db.create-tables.yaml
    enabled: true

  data:
    redis:
      host: localhost
      port: 6379

  cache:
    type: redis
server:
  port: 8001