name: CI Pipeline

on:
  push:
    branches:
      - feature/**

  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Grant permission
        run: chmod +x gradlew

      - name: Clean userservice
        run: ./gradlew :userservice:clean

      - name: Clean authservice
        run: ./gradlew :authservice:clean

      - name: Clean orderservice
        run: ./gradlew :orderservice:clean

      - name: test
        run: ./gradlew test

      - name: SonarQube
        run: ./gradlew :userservice:sonar :authservice:sonar :orderservice:sonar
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}



      - name: Docker login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Docker build eureka
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/eurekaserver:latest -f eurekaserver/Dockerfile .

      - name: Docker push eureka
        run: docker push ${{ secrets.DOCKER_USERNAME }}/eurekaserver:latest

      - name: Docker build
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/userservice:latest -f userservice/Dockerfile .
      - name: Docker push
        run: docker push ${{ secrets.DOCKER_USERNAME }}/userservice:latest

      - name: Docker build auth
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/authservice:latest -f authservice/Dockerfile .

      - name: Docker push auth
        run: docker push ${{ secrets.DOCKER_USERNAME }}/authservice:latest

      - name: Docker build order
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/orderservice:latest -f orderservice/Dockerfile .

      - name: Docker push order
        run: docker push ${{ secrets.DOCKER_USERNAME }}/orderservice:latest