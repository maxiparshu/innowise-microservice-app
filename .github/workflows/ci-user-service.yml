name: CI Pipeline

on:
  push:
    branches:
      - feature/**

  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Grant permission
        run: chmod +x gradlew

      - name: Build + Test
        run: ./gradlew :userservice:clean build

      - name: SonarQube
        run: ./gradlew :userservice:sonar
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Docker build
        run: docker build ./userservice

      - name: Docker login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Docker push
        run: |
          docker tag userservice:latest ${{ secrets.DOCKER_USERNAME }}/userservice:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/userservice:latest