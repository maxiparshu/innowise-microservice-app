name: CI Pipeline

on:
  push:
    branches:
      - feature/**

  pull_request:
    branches:
      - main

jobs:

  build-test-sonar-docker:
    runs-on: ubuntu-latest


    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Grant execute permission for Gradle
        run: chmod +x gradlew

      - name: Build application
        run: ./gradlew :userservice:clean :userservice:bootJar -x test

      - name: Run tests
        run: ./gradlew :userservice:test

      - name: SonarQube analysis
        run: ./gradlew :userservice:sonar
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
