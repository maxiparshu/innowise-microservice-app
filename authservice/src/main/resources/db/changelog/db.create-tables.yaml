  databaseChangeLog:

    - changeSet:
        id: 001-create-user-credentials
        author: postgres

        changes:
          - createTable:
              tableName: user_credentials
              columns:

                - column:
                    name: id
                    type: BIGSERIAL
                    constraints:
                      primaryKey: true
                      nullable: false

                - column:
                    name: user_id
                    type: BIGINT
                    constraints:
                      nullable: false
                      unique: true

                - column:
                    name: login
                    type: VARCHAR(100)
                    constraints:
                      nullable: false
                      unique: true

                - column:
                    name: password_hash
                    type: VARCHAR(255)
                    constraints:
                      nullable: false

                - column:
                    name: role
                    type: VARCHAR(20)
                    defaultValue: USER
                    constraints:
                      nullable: false

                - column:
                    name: active
                    type: BOOLEAN
                    defaultValueBoolean: true
                    constraints:
                      nullable: false

                - column:
                    name: created_at
                    type: TIMESTAMP
                    constraints:
                      nullable: false

                - column:
                    name: updated_at
                    type: TIMESTAMP
                    constraints:
                      nullable: false

          - createIndex:
              tableName: user_credentials
              indexName: idx_user_credentials_user_id
              columns:
                - column:
                    name: user_id

          - createIndex:
              tableName: user_credentials
              indexName: idx_user_credentials_login
              columns:
                - column:
                    name: login

          - createIndex:
              tableName: user_credentials
              indexName: idx_user_credentials_role
              columns:
                - column:
                    name: role



    - changeSet:
        id: 002-create-refresh-tokens
        author: postgres

        changes:

          - createTable:
              tableName: refresh_tokens
              columns:

                - column:
                    name: id
                    type: BIGSERIAL
                    constraints:
                      primaryKey: true
                      nullable: false

                - column:
                    name: user_id
                    type: BIGINT
                    constraints:
                      nullable: false

                - column:
                    name: token
                    type: VARCHAR(500)
                    constraints:
                      nullable: false
                      unique: true

                - column:
                    name: expires_at
                    type: TIMESTAMP
                    constraints:
                      nullable: false

                - column:
                    name: revoked
                    type: BOOLEAN
                    defaultValueBoolean: false
                    constraints:
                      nullable: false

                - column:
                    name: created_at
                    type: TIMESTAMP
                    constraints:
                      nullable: false

          - createIndex:
              tableName: refresh_tokens
              indexName: idx_refresh_tokens_user_id
              columns:
                - column:
                    name: user_id

          - createIndex:
              tableName: refresh_tokens
              indexName: idx_refresh_tokens_expires_at
              columns:
                - column:
                    name: expires_at
