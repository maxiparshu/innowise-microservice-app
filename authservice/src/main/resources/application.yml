spring:
  application:
    name: auth-service

  jpa:
    hibernate:
      ddl-auto: validate


  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver


  liquibase:
    change-log: classpath:db/changelog/db.create-tables.yaml
    enabled: true

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 900000
  admin-password: ${ADMIN_PASSWORD}

server:
  port: 8002

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER}

auth:
  admin:
    user-id: -1