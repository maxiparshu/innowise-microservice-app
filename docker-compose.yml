version: '3.9'

services:
  userservice-postgres:
    image: postgres:16
    container_name: userservice-postgres
    env_file:
      .env
    environment:
      POSTGRES_DB: ${POSTGRES_USERS_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5444:5432"
    volumes:
      - userdb_data:/var/lib/postgresql/data

  authservice-postgres:
    image: postgres:16
    container_name: authservice-postgres
    env_file:
      .env
    environment:
      POSTGRES_DB: ${POSTGRES_AUTH_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5445:5432"
    volumes:
      - authdb_data:/var/lib/postgresql/data

  orderservice-postgres:
    image: postgres:16
    container_name: orderservice-postgres
    env_file:
      .env
    environment:
      POSTGRES_DB: ${POSTGRES_ORDER_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5446:5432"
    volumes:
      - orderdb_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: redis
    ports:
      - "6379:6379"

  eureka-server:
    build:
      context: .
      dockerfile: eurekaserver/Dockerfile

    container_name: eureka-server

    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8800:8800"

  api-gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile

    container_name: api-gateway

    env_file:
      ./gateway/.docker.env

    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8066:8066"


  user-service:
    build:
      context: .
      dockerfile: userservice/Dockerfile

    container_name: user-service

    env_file:
      ./userservice/.docker.env

    depends_on:
      - userservice-postgres
      - redis
      - eureka-server

    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8001:8001"

  auth-service:
    build:
      context: .
      dockerfile: authservice/Dockerfile

    container_name: auth-service

    env_file:
      ./authservice/.docker.env

    depends_on:
      - authservice-postgres
      - eureka-server

    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8002:8002"

  order-service:
    build:
      context: .
      dockerfile: orderservice/Dockerfile

    container_name: order-service

    env_file:
      ./orderservice/.docker.env

    depends_on:
      - orderservice-postgres
      - eureka-server

    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8003:8003"


volumes:
  userdb_data:
  authdb_data:
  orderdb_data: