version: '3.9'

services:
  postgres:
    image: postgres:16
    container_name: postgres

    env_file:
      .env

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5444:5432"

    volumes:
      - userdb_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: redis

    ports:
      - "6379:6379"

  user-service:
    build:
      context: ./userservice

    container_name: user-service

    env_file:
      ./userservice/.docker.env

    depends_on:
      - postgres
      - redis

    environment:
      SPRING_PROFILES_ACTIVE: docker

    ports:
      - "8001:8001"

volumes:
  userdb_data: