version: '3.9'

services:
  postgres:
    image: postgres:16
    container_name: userdb

    env_file:
      .env

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5444:5432"

    volumes:
      - userdb_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: redis-cache

    ports:
      - "6379:6379"
volumes:
  userdb_data: